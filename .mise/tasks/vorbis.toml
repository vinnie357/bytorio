["deps:vorbis"]
sources = ["runtime/vorbis/**", "tools/vorbis-build.mjs", ".mise/toolchain.toml"]
outputs = ["build/vorbis/vorbis.js", "build/vorbis/vorbis.wasm"]
run = "node tools/vorbis-build.mjs"

# The Windows native player links this bridge; no other host builds or needs it.
["deps:vorbis:native"]
depends = ["deps:vorbis"]
sources = ["runtime/vorbis/**", "tools/vorbis-build.mjs", ".mise/toolchain.toml"]
outputs = ["build/vorbis/native/Release/bytorio-vorbis.lib"]
run = "node tools/vorbis-build.mjs --bridge"

["test:ogg"]
description = "Verify Vorbis looping and EOF in both SDKs and hosts"
run = "node tools/verify-ogg.mjs"

# Non-Windows native players link this SDL3 build; Windows uses Odin's vendored SDL3.dll.
["deps:sdl3:native"]
sources = ["tools/sdl3-build.mjs", ".mise/toolchain.toml"]
outputs = ["build/sdl3/install/lib/libSDL3.dylib"]
run = "node tools/sdl3-build.mjs"
