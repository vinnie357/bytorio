# Reuse only compiled harnesses. Every verifier still runs all tests and replays.

["deps:trace:resources"]
depends = ["deps:vorbis:native"]
sources = [
  "runtime/odin/cartridge/**/*.odin",
  "runtime/odin/abi/**/*.odin",
  "runtime/odin/audio/**/*.odin",
  "runtime/odin/core/**/*.odin",
  "runtime/odin/guest/**/*.odin",
  "runtime/odin/resource_protocol/**/*.odin",
  "runtime/odin/resources/**/*.odin",
  "tests/resources/player/**/*.odin",
  "tools/build-trace.mjs",
  "tools/toolchain.mjs",
  "tools/command-timing.mjs",
  ".mise/toolchain.toml",
]
outputs = ["build/validation-tools/resources/trace.exe"]
run = "node tools/build-trace.mjs resources"

