[tool_alias]
clang-format = "github:cpp-linter/clang-tools-static-binaries"
clang-tidy = "github:cpp-linter/clang-tools-static-binaries"

[tools]
"github:DanielGavin/ols" = {version = "dev-2026-10", rename_exe = {"ols-*" = "ols", "odinfmt-*" = "odinfmt"}}
luau = "0.743"
node = "24.19.0"
bun = "1.3.6"
odin = {version = "dev-2026-10", strip_components = 1, bin_path = "."}
stylua = "2.6.0"
# Used only by the upstream Emscripten SDK, not by project scripts.
clang-format = {version = "llvm-23.1.3", matching = "clang-format-23_", bin = "clang-format", format = "raw"}
clang-tidy = {version = "llvm-23.1.3", matching = "clang-tidy-23_", bin = "clang-tidy", format = "raw"}
cmake = "4.3.3"
"github:ctxshift/bees" = "0.4.0"
ninja = "1.13.1"
python = "3.13.3"
"vfox:jdx/vfox-emsdk" = {version = "6.0.12", depends = ["python"]}

# One entry with per-platform assets and checksums: a second key for the same tool replaces the
# first, so separate [macos] and [linux] keys would leave only the last host with Wasmtime.
[tools."github:bytecodealliance/wasmtime"]
version = "49.0.3"

[tools."github:bytecodealliance/wasmtime".platforms.windows-x64]
asset_pattern = "wasmtime-v49.0.3-x86_64-windows-c-api.zip"
checksum = "sha256:f8dabbc1df2358f15effbd6e50c940c03df3836e13cbf4f09cdf6369057aed01"

[tools."github:bytecodealliance/wasmtime".platforms.macos-arm64]
asset_pattern = "wasmtime-v49.0.3-aarch64-macos-c-api.tar.xz"
checksum = "sha256:0c853eb1715b3730304f926d111d4b4a3605b961c5693753bfeeb6b19332c41b"

[tools."github:bytecodealliance/wasmtime".platforms.linux-x64]
asset_pattern = "wasmtime-v49.0.3-x86_64-linux-c-api.tar.xz"
checksum = "sha256:49c9641ac1f6158ed90404115315b36a9ae68338acda16fcf00f0819622ccd97"
